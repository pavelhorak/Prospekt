cluster_id: clust_002
cluster_label: Median wages have not kept pace with post-pandemic inflation in essential
  costs
cluster_summary: 'Working and middle-class Americans — particularly those earning
  near the

  median income of ~$28–29K/year — find that rent, car payments, and

  groceries now consume effectively all of their take-home pay, leaving

  nothing for savings, homeownership, or family formation. Headline

  macroeconomic indicators (GDP growth, low unemployment) mask this

  affordability crisis and create a disconnect between official economic

  narratives and lived financial reality. The persona is the median-wage

  earner who is nominally employed but concretely priced out of the life

  trajectory — homeownership, car ownership, children — that prior

  generations at the same income level could achieve; their current

  workaround is frustration and distrust of financial media.

  '
