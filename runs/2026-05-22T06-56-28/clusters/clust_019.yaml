cluster_id: clust_019
cluster_label: Job applicants receive no response or feedback after interviews
cluster_summary: 'Job seekers — particularly in tech — are routinely ghosted after
  applying

  or interviewing, receiving no rejection notice and no explanation. Hiring

  managers acknowledge the problem but cite legal risk (any specific feedback

  could be construed as discriminatory) and the sheer difficulty of writing

  honest, tactful rejections at scale as reasons they stay silent. The result

  is a structural norm where candidates are left in indefinite limbo, with

  even dedicated job-platform intermediaries sometimes failing to close the

  communication loop.

  '
