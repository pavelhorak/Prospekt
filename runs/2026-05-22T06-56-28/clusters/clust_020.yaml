cluster_label: iOS developers unsure whether Swift 1.0 is stable enough to adopt in
  production
cluster_summary: 'Mobile developers and engineering leads at companies building Apple-platform

  apps are weighing Swift adoption but can''t get a confident read on its

  production readiness. Specific blockers include Objective-C API interop

  friction, slow compilation on larger codebases, and Xcode 6 tooling

  instability. Currently they either stay on Objective-C, limit Swift to

  greenfield small apps, or gather anecdotes from peers before committing.

  '
