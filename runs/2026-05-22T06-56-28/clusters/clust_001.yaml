  which is a scraping/automation-evasion question, not a browser quirk.

  Signal sig_6434970a7928 is a third problem: local developer environment

  setup (geckodriver not on PATH), a one-time tooling configuration

  question with no relation to either browser compatibility or bot

  detection.

