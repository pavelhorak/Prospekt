cluster_summary: 'Critics and experienced platform users argue that "free speech"
  social networks

  fail on two simultaneous fronts: they attract and amplify genuinely harmful content

  (CSAM, terrorism, organized crime, harassment), and they structurally trap themselves

  in an echo chamber of banned users that makes mainstream growth impossible. The
  persona

  is a skeptical technologist or long-time community participant who has watched prior

  attempts (Voat, Ruqqus, Parler) collapse under these same dynamics, and who views
  the

  moderation-vs-free-speech framing as a false choice that ignores product reality.

  '
