cluster_summary: "These four signals do not share a single underlying problem. At\
  \ least three\ndistinct problems are mixed together:\n\n1. ESM/CJS module interop\
  \ when loading TypeScript plugins (sig_a010122cb0f7):\n   a developer in a large\
  \ monorepo hits a cascade of Node.js ESM resolver\n   failures — extensionless imports,\
  \ __dirname, dynamic require — while trying\n   to wire a local TypeScript ESLint\
  \ plugin into oxlint.\n\n2. Basic JavaScript module system questions (sig_4be3c87f89e3,\n\
  \   sig_93450337c6c7): a beginner asks how to include functions from another\n \
  \  file in Node.js/Express, and a separate user asks how to copy a static HTML\n\
  \   file through webpack. Both are entry-level \"how does JS module/build\n   plumbing\
  \ work\" questions, not pain around a broken workflow.\n\n3. TypeScript compiler\
  \ type-predicate limitations (sig_36d4c96376a3): a\n   library maintainer hits TS2677\
  \ — the TypeScript checker rejecting\n   conditional-type predicates — and must\
  \ choose between simplifying types or\n   converting to assertion functions. This\
  \ is a static-analysis / type-system\n   problem unrelated to module loading or\
  \ build configuration.\n"
