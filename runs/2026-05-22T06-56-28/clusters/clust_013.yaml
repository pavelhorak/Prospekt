cluster_id: clust_013
cluster_label: Remote SWE job seekers can't reliably identify genuinely remote-first
  roles
cluster_summary: 'Software engineers seeking fully-remote positions are repeatedly
  misled by job

  listings labelled "remote" that turn out to require in-office attendance. Existing

  aggregators surface these hybrid or location-restricted roles without filtering
  them

  out, so candidates waste time clicking through mislabelled postings or resort to

  building their own tooling — spreadsheets, custom scrapers, cron-driven boards —
  just

  to find roles that are actually remote. The core pain is the unreliable signal quality

  of the "remote" label itself, not a shortage of jobs.

  '
