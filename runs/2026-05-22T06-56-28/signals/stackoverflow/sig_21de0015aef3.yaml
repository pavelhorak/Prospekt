raw_text: "Parsing JSON with Unix tools\n\n<p>I'm trying to parse JSON returned from\
  \ a curl request, like so:</p>\n\n<pre><code>curl 'http://twitter.com/users/username.json'\
  \ |\n    sed -e 's/[{}]/''/g' | \n    awk -v k=\"text\" '{n=split($0,a,\",\"); for\
  \ (i=1; i&lt;=n; i++) print a[i]}'\n</code></pre>\n\n<p>The above splits the JSON\
  \ into fields, for example:</p>\n\n<pre><code>% ...\n\"geo_enabled\":false\n\"friends_count\"\
  :245\n\"profile_text_color\":\"000000\"\n\"status\":\"in_reply_to_screen_name\"\
  :null\n\"source\":\"web\"\n\"truncated\":false\n\"text\":\"My status\"\n\"favorited\"\
  :false\n% ...\n</code></pre>\n\n<p>How do I print a specific field (denoted by the\
  \ <code>-v k=text</code>)?</p>"
