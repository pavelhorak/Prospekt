raw_text: "Building and running app via Gradle and Android Studio is slower than via\
  \ Eclipse\n\n<p>I have a multi-project (~10 modules) of which building takes about\
  \ 20-30 seconds each time. When I press Run in Android Studio, I have to wait every\
  \ time to rebuild the app, which is extremely slow.</p>\n\n<p>Is it possible to\
  \ automate building process in Android Studio? Or do you have any advice on how\
  \ to make this process faster?</p>\n\n<p>In Eclipse, thanks to automatic building,\
  \ running the same project on an emulator takes about 3-5 seconds.</p>\n\n<p>This\
  \ is my build.gradle file (app module):</p>\n\n<pre><code>buildscript {\n    repositories\
  \ {\n        maven { url 'http://repo1.maven.org/maven2' }\n    }\n    dependencies\
  \ {\n        classpath 'com.android.tools.build:gradle:0.4'\n    }\n}\napply plugin:\
  \ 'android'\n\ndependencies {\n    compile fileTree(dir: 'libs', include: '*.jar')\n\
  \    compile project(':libraries:SharedLibs')\n    compile project(':libraries:actionbarsherlock')\n\
  \    compile project(':libraries:FacebookSDK')\n    compile project(':libraries:GooglePlayServices')\n\
  \    compile project(':libraries:HorizontalGridView')\n    compile project(':libraries:ImageViewTouch')\n\
  \    compile project(':libraries:SlidingMenu')\n}\n\nandroid {\n    compileSdkVersion\
  \ 17\n    buildToolsVersion \"17.0.0\"\n\n    defaultConfig {\n        minSdkVersion\
  \ 8\n        targetSdkVersion 16\n    }\n}\n</code></pre>"
