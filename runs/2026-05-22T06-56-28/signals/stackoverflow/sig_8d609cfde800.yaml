signal_id: sig_8d609cfde800
raw_text: "How do I get the @RolesAllowed annotation to work for my Web application?\n\
  \n<p>I am making a Web application using Backbone.js, Bootstrap, NetBeans IDE 8.0,\
  \ Java EE 7, JDK 8, WildFly server 8.1.0, JBoss RESTEasy (resteasy-jaxrs-3.0.8),\
  \ JBoss 2.2.22, JBoss EJB 3.</p>\n\n<p>I am (relatively) new to Web development,\
  \ and as such I have only just started to grasp a lot of basic concepts and technologies.\
  \ I am trying to build a permission system with users and roles into a Web application,\
  \ but I cannot seem to make the <em>@RolesAllowed annotation</em> to work in my\
  \ RESTful Web Service. I am already working on this problem for a few days.</p>\n\
  \n<p>I have a RESTful resource (Java Enterprise/Session Bean?) called <em>UserResource.java</em>,\
  \ in here I have a method <em>create</em> to create a new user for the application:</p>\n\
  \n<pre><code>import java.net.URI;\nimport java.security.Principal;\nimport java.util.List;\n\
  import javax.annotation.security.PermitAll;\nimport javax.annotation.security.RolesAllowed;\n\
  import javax.ejb.EJB;\nimport javax.ejb.Stateless;\nimport javax.ws.rs.*;\nimport\
  \ javax.ws.rs.core.*;\nimport org.jboss.ejb3.annotation.SecurityDomain;\n\n@Stateless\n\
  @SecurityDomain(\"other\")\n@Path(\"/user\")\npublic class UserResource {\n    @EJB(name\
  \ = \"UserServiceImp\")\n    UserService userService;\n\n    @Context\n    private\
  \ UriInfo uriInfo;\n\n    @RolesAllowed({\"admin\"})\n    @Path(\"create\")\n  \
  \  @POST\n    public Response create(CreateRequest request) {        \n        try\
  \ {\n            System.out.println(\"Start of create method\");\n            User\
  \ user = userService.createUser(request);\n            return getCreateResponse(user);\n\
  \        }\n        catch (Exception e){\n            return Response.status(401).entity(\"\
  Failed to create user\").build();\n        }\n    }\n}\n</code></pre>\n\n<p>This\
  \ <em>create</em> method works if I use the @PermitAll annotation, but it fails\
  \ with an error if I use the @RolesAllowed annotation.</p>\n\n<p>I have this Backbone\
  \ view <em>CreateUserView</em> which provides a form (in HTML) to an end user (with\
  \ admin rights) for creating new users for the application. On clicking the submit\
  \ button, JSON data gets send to the url 'rest/user/create' for creating a new user.\
  \ Before the <em>create</em> method in <em>UserResource.java</em> gets executed,\
  \ my <em>SecurityInterceptor.java</em> (which implements <em>javax.ws.rs.container.ContainerRequestFilter</em>)\
  \ checks if the user has the required permissions. I have debugged this thorough\
  \ and the Security Interceptor is functioning as it should. So after the Security\
  \ Interceptor gives clear access, something goes wrong in <em>UserResource.java</em>.\
  \ (As a side note, not sure if this is important, but I believe the Security Interceptor\
  \ is based on <a href=\"http://howtodoinjava.com/2013/07/25/jax-rs-2-0-resteasy-3-0-2-final-security-tutorial/\"\
  \ rel=\"noreferrer\">this blog post about RESTEasy security</a>. I was working on\
  \ the application with another guy, he initially implemented it, so I'm not sure..\
  \ but it looks almost identical. Anyway that guy has moved on to another project\
  \ a few weeks ago.)</p>\n\n<p>The error I am getting (output from the server) is\
