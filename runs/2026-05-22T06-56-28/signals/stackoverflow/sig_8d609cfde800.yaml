  >jax-rs service RolesAllowed Annotation throwing exception</a>) and others which\
  \ have solutions that either do not work for me or maybe I do not apply the solution\
  \ correctly (e.g. <a href=\"https://stackoverflow.com/questions/24591782/resteasy-support-for-jax-rs-rolesallowed\"\
  >RESTEasy support for JAX-RS @RolesAllowed</a>).</p>\n\n<p>I found this: <a href=\"\
  https://developer.jboss.org/thread/177728?start=0&amp;tstart=0\" rel=\"noreferrer\"\
  >https://developer.jboss.org/thread/177728?start=0&amp;tstart=0</a> (titled: <em>\"\
  @RolesAllowed, @DenyAll require presence of org.jboss.ejb3.annotation.SecurityDomain?\"\
  </em>), In tried the solution but I cannot get it to work for my project. Not sure\
  \ if the solution is not applicable for my situation or if I'm just doing it wrong.</p>\n\
  \n<p>I found this: <a href=\"https://developer.jboss.org/message/720815\" rel=\"\
  noreferrer\">https://developer.jboss.org/message/720815</a> (titled: <em>\"is this\
  \ a defect for processing org.jboss.ejb3.annotation.SecurityDomain ?\"</em>), but\
  \ I do not understand where my <em>jboss-ejb-client.properties</em> are supposed\
  \ to be. I think they set their project up quite different from me. So no luck with\
  \ that.</p>\n\n<p>I found <a href=\"https://github.com/jboss-eap/quickstart/tree/master-eap6/ejb-security\"\
  \ rel=\"noreferrer\">a guide on EJB3 security</a>, as suggested there, I provided\
  \ the following code in my <em>standalone.xml</em>-file:</p>\n\n<pre><code>&lt;security-domain\
  \ name=\"other\" cache-type=\"default\"&gt;\n    &lt;authentication&gt;\n      \
  \  &lt;login-module code=\"Remoting\" flag=\"optional\"&gt;\n            &lt;module-option\
  \ name=\"password-stacking\" value=\"useFirstPass\"/&gt;\n        &lt;/login-module&gt;\n\
  \        &lt;login-module code=\"RealmDirect\" flag=\"required\"&gt;\n         \
  \   &lt;module-option name=\"password-stacking\" value=\"useFirstPass\"/&gt;\n \
  \       &lt;/login-module&gt;\n    &lt;/authentication&gt;\n&lt;/security-domain&gt;\n\
  </code></pre>\n\n<p>But that did not solve anything at all. I am not sure if it\
  \ did anything.</p>\n\n<p>Finally, I found this SO question: <a href=\"https://stackoverflow.com/questions/24591782/resteasy-support-for-jax-rs-rolesallowed\"\
  >RESTEasy support for JAX-RS @RolesAllowed</a> (which references to the <a href=\"\
  http://docs.jboss.org/resteasy/docs/3.0.5.Final/userguide/html/Securing_JAX-RS_and_RESTeasy.html\"\
  \ rel=\"noreferrer\">RESTEasy Documentation</a>). Even though I also mentioned this\
  \ question a few paragraphs up as containing a solution that does not work for me,\
  \ it did change the error to another error. As suggested there I added a <em>&lt;context-param&gt;</em>-block\
  \ to my <em>web.xml</em>-file:</p>\n\n<pre><code>&lt;?xml version=\"1.0\" encoding=\"\
  UTF-8\"?&gt;\n&lt;web-app version=\"2.5\" xmlns=\"http://java.sun.com/xml/ns/javaee\"\
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
  http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-app_2_5.xsd\"\
  &gt;\n    &lt;security-constraint&gt;\n        &lt;web-resource-collection&gt;\n\
  \            &lt;web-resource-name&gt;PGB&lt;/web-resource-name&gt;\n          \
  \  &lt;url-pattern&gt;/*&lt;/url-pattern&gt;\n            &lt;http-method&gt;GET&lt;/http-method&gt;\n\
  \            &lt;http-method&gt;POST&lt;/http-method&gt;\n        &lt;/web-resource-collection&gt;\n\
  \n        &lt;user-data-constraint&gt;\n            &lt;!-- use of SSL is required\
  \ when CONFIDENTIAL is specified --&gt;\n            &lt;transport-guarantee&gt;CONFIDENTIAL&lt;/transport-guarantee&gt;\n\
  \        &lt;/user-data-constraint&gt;\n    &lt;/security-constraint&gt;\n\n   \
  \ &lt;context-param&gt;\n      &lt;param-name&gt;resteasy.role.based.security&lt;/param-name&gt;\n\
  \      &lt;param-value&gt;true&lt;/param-value&gt;\n   &lt;/context-param&gt;\n\
  &lt;/web-app&gt;\n</code></pre>\n\n<p>Which results in the following error if I\
  \ try to create a new user (not completely posted here due to character limit of\
  \ SO questions):</p>\n\n<pre><code>16:58:45,992 WARN  [org.jboss.resteasy.core.ExceptionHandler]\
  \ (default task-61) failed to execute: javax.ws.rs.ForbiddenException: HTTP 403\
  \ Forbidden\n    at org.jboss.resteasy.plugins.interceptors.RoleBasedSecurityFilter.filter(RoleBasedSecurityFilter.java:45)\
  \ [resteasy-jaxrs-3.0.8.Final.jar:]\n    at ... etc.\n</code></pre>\n\n<p>This error\
  \ is not very helpful either, in fact, I find even less information when I search\
  \ on that error than when I search on the previous error. So, I am not sure if that\
  \ is a step into the right direction. What is better to have returned from the server?\
  \ A status 500 (Internal Server Error) or a status 403 (Forbidden)? Also, if after\
  \ applying that \"solution\" I change the annotation to @PermitAll, then the creation\
  \ of a new user works just as before, so it didn't really make the situation any\
  \ worse.</p>\n\n<p>However, I can find <a href=\"https://github.com/resteasy/Resteasy/blob/master/jaxrs/resteasy-jaxrs/src/main/java/org/jboss/resteasy/plugins/interceptors/RoleBasedSecurityFilter.java\"\
  \ rel=\"noreferrer\">the source code of RoleBasedSecurityFilter</a>, which shows\
  \ that it throws the <code>ForbiddenException</code>. It shows that a certain <em>isUserInRole</em>\
  \ method must return true, but it does not do that in my application. I can't get\
  \ it to return true. It makes me wonder, <a href=\"https://stackoverflow.com/q/26039920/2541501\"\
  >Is it possible to disable RoleBasedSecurityFilter.java of RESTEasy?</a></p>\n\n\
  <p>I also found the following SO question: <a href=\"https://stackoverflow.com/questions/15188895/rolesallowed-cannot-be-resolved-with-jersey\"\
  >@RolesAllowed cannot be resolved with Jersey</a>, which is answered by Abhijit\
  \ Sarkar, and he refers to <a href=\"http://www-01.ibm.com/support/knowledgecenter/SSAW57_8.5.5/com.ibm.websphere.nd.multiplatform.doc/ae/twbs_jaxrs_impl_securejaxrs_webcont.html?cp=SSAW57_8.5.5%2F3-3-0-42-3-0\"\
  \ rel=\"noreferrer\">an IBM article</a>. Maybe the solution to my problem lies in\
  \ there, but I have not found it yet.. Anyway, it is suggested there that either\
  \ adding a <em>security-role</em> block to my <em>web.xml</em>-file or adding a\
  \ <em>@DeclareRoles</em> annotation to my <em>UserResource.java</em> file should\
  \ solve the problem, but the HTTP 403 Forbidden warning still remains after I do\
  \ so. It is very frustrating.</p>\n\n<p>My <em>security-role</em> block (in web.xml)\
  \ looks as follows:</p>\n\n<pre><code>&lt;security-role id=\"role_admin\"&gt;\n\
  \    &lt;description&gt;This is role 1 (admin)&lt;/description&gt;\n    &lt;role-name&gt;admin&lt;/role-name&gt;\n\
  &lt;/security-role&gt;\n</code></pre>\n\n<p>And I added the following <em>security-constraint</em>\
  \ block (in web.xml): (note the <em>auth-constraint</em>)</p>\n\n<pre><code>&lt;security-constraint&gt;\n\
  \    &lt;web-resource-collection&gt;\n        &lt;web-resource-name&gt;PGB&lt;/web-resource-name&gt;\n\
  \        &lt;url-pattern&gt;/rest/user/create&lt;/url-pattern&gt;\n        &lt;http-method&gt;GET&lt;/http-method&gt;\n\
  \        &lt;http-method&gt;POST&lt;/http-method&gt;\n    &lt;/web-resource-collection&gt;\n\
  \    &lt;auth-constraint id=\"AuthConstraint_createUser\"&gt;\n        &lt;description&gt;\
  \ Only admin can create a new user&lt;/description&gt;\n        &lt;role-name&gt;admin&lt;/role-name&gt;\n\
  \    &lt;/auth-constraint&gt;\n    &lt;user-data-constraint&gt;\n        &lt;!--\
  \ use of SSL is required when CONFIDENTIAL is specified --&gt;\n        &lt;transport-guarantee&gt;CONFIDENTIAL&lt;/transport-guarantee&gt;\n\
  \    &lt;/user-data-constraint&gt;\n&lt;/security-constraint&gt;\n</code></pre>\n\
  \n<p>I realize now that my problem lies either in the deployment descriptors (<em>web.xml</em>)\
  \ or the server configuration (WildFly's <em>standalone-full.xml</em>).</p>\n\n\
  <p>I added a <code>login-config</code> element (with <a href=\"http://docs.oracle.com/cd/E19798-01/821-1841/bncbn/index.html\"\
  \ rel=\"noreferrer\">FORM authentication</a>) to my <em>web.xml</em> file. Changed\
  \ my login HTML page to fit <a href=\"http://docs.oracle.com/cd/E19798-01/821-1841/bncca/index.html\"\
  \ rel=\"noreferrer\">the required format</a>. I followed some of the step of this\
  \ article on <a href=\"http://docs.oracle.com/cd/E19798-01/821-1841/bncca/index.html\"\
  \ rel=\"noreferrer\">migrating a Java EE App from GlassFish to WildFly</a>, but\
  \ I think I still did something wrong because I always get at the login error page\
  \ when trying to log in with valid user credentials.</p>\n\n<p>See here the <code>security-domain</code>\
  \ element I added to my WildFly configuration:</p>\n\n<pre><code>&lt;security-domain\
  \ name=\"app\" cache-type=\"default\"&gt;\n    &lt;authentication&gt;\n        &lt;login-module\
  \ code=\"Database\" flag=\"required\"&gt;\n            &lt;module-option name=\"\
  dsJndiName\" value=\"java:jboss/datasources/mySQL_pool_rel\"/&gt;\n            &lt;module-option\
  \ name=\"principalsQuery\" value=\"select hashed_password from user where email_address=?\"\
  /&gt;\n            &lt;module-option name=\"rolesQuery\" value=\"select role_name,\
  \ 'Roles' from role r inner join user u on r.role_type = u.role_type where u.email_address\
  \ = ?\"/&gt;\n            &lt;module-option name=\"hashAlgorithm\" value=\"SHA-256\"\
  /&gt;\n            &lt;module-option name=\"hashEncoding\" value=\"BASE64\"/&gt;\n\
  \            &lt;module-option name=\"unauthenticatedIdentity\" value=\"guest\"\
  /&gt;\n        &lt;/login-module&gt;\n        &lt;login-module code=\"RoleMapping\"\
  \ flag=\"required\"&gt;\n             &lt;module-option name=\"rolesProperties\"\
  \ value=\"file:${jboss.server.config.dir}/app.properties\"/&gt;\n             &lt;module-option\
  \ name=\"replaceRole\" value=\"false\"/&gt;\n        &lt;/login-module&gt;\n   \
  \ &lt;/authentication&gt;\n&lt;/security-domain&gt;\n</code></pre>\n\n<p>I think\
  \ something is wrong with my <em>rolesQuery</em> defined there, but I can't figure\
  \ out what.</p>\n\n<p>I would love to know how to implement role-based security\
  \ for my Web application. Therefore, I also accept other approaches to role-based\
  \ security, as long as it works. Suggestions are welcome.</p>\n\n<p>I also placed\
  \ <a href=\"https://developer.jboss.org/thread/248877\" rel=\"noreferrer\">my question\
  \ on developer.jboss.org</a>, but I also got no response there yet.</p>\n\n<p>I\
  \ provided one workaround solution to my problem as an answer to this question,\
  \ but it is not a real solution (as explained in that answer). I am still interested\
  \ in doing this the right way.</p>"
