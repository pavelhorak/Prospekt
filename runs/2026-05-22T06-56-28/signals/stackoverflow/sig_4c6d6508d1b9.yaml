raw_text: "Specify sudo password for Ansible\n\n<p>How do I specify a sudo password\
  \ for Ansible in non-interactive way?</p>\n\n<p>I'm running Ansible playbook like\
  \ this:</p>\n\n<pre><code>$ ansible-playbook playbook.yml -i inventory.ini \\\n\
  \    --user=username --ask-sudo-pass\n</code></pre>\n\n<p>But I want to run it like\
  \ this:</p>\n\n<pre><code>$ ansible-playbook playbook.yml -i inventory.ini \\\n\
  \    --user=username` **--sudo-pass=12345**\n</code></pre>\n\n<p>Is there a way?\
  \ I want to automate my project deployment as much as possible.</p>"
