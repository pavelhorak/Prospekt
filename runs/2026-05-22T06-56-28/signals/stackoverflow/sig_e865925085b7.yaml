raw_text: 'Formatting Decimal places in R


  <p>I have a number, for example 1.128347132904321674821 that I would like to show
  as only two decimal places when output to screen (or written to a file). How does
  one do that? </p>


  <pre><code>x &lt;- 1.128347132904321674821

  </code></pre>


  <p>EDIT: </p>


  <p>The use of: </p>


  <pre><code>options(digits=2)

  </code></pre>


  <p>Has been suggested as a possible answer. Is there a way to specify this within
  a script for one-time use? When I add it to my script it doesn''t seem to do anything
  different and I''m not interested in a lot of re-typing to format each number (I''m
  automating a very large report). </p>


  <p>-- </p>


  <p>Answer: round(x, digits=2)</p>'
