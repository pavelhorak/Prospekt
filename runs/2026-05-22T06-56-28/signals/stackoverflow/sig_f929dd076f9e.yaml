raw_text: 'How to convert a column number (e.g. 127) into an Excel column (e.g. AA)


  <p>How do you convert a numerical number to an Excel column name in C# without using
  automation getting the value directly from Excel.</p>


  <p>Excel 2007 has a possible range of 1 to 16384, which is the number of columns
  that it supports. The resulting values should be in the form of excel column names,
  e.g. A, AA, AAA etc.</p>'
