  <pre><code>cmd = &quot;some unix command&quot;

  retcode = subprocess.call(cmd,shell=True)

  </code></pre>

  <p>However, I need to run some commands on a remote machine. Manually, I would log
  in using <code>ssh</code> and then run the commands. How would I automate this in
