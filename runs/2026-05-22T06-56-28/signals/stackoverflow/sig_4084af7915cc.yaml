raw_text: 'Git is not working after macOS update (&quot;xcrun: error: invalid active
  developer path (/Library/Developer/CommandLineTools&quot;)


  <p>I updated to the latest OS, and/or restarted my computer (this happens on every
  major update, but this time all I did was restart my computer on 2022-09-13).</p>

  <p>This morning I navigated to my work''s codebase in the command line on my <a
  href="https://en.wikipedia.org/wiki/MacBook_Pro" rel="noreferrer">MacBook Pro</a>,
  typed in &quot;git status&quot; in the repository and received an error:</p>

  <p>(In 9/2022, this error was much different, but I didn''t capture it)</p>

  <blockquote>

  <p>xcrun: error: invalid active developer path (/Library/Developer/CommandLineTools),
  missing xcrun at: /Library/Developer/CommandLineTools/usr/bin/xcrun</p>

  </blockquote>

  <p>Git will not work!</p>

  <p>How do I fix Git, and the command-line tools?</p>'
