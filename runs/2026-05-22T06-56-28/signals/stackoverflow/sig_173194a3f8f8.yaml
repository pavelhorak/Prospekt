raw_text: "Remove pandas rows with duplicate indices\n\n<p>How to remove rows with\
  \ duplicate index values?</p>\n<p>In the weather DataFrame below, sometimes a scientist\
  \ goes back and corrects observations -- not by editing the erroneous rows, but\
  \ by appending a duplicate row to the end of a file.</p>\n<p>I'm reading some automated\
  \ weather data from the web (observations occur every 5 minutes, and compiled into\
  \ monthly files for each weather station.) After parsing a file, the DataFrame looks\
  \ like:</p>\n<pre><code>                      Sta  Precip1hr  Precip5min  Temp \
  \ DewPnt  WindSpd  WindDir  AtmPress\nDate                                     \
  \                                                 \n2001-01-01 00:00:00  KPDX  \
  \        0           0     4       3        0        0     30.31\n2001-01-01 00:05:00\
  \  KPDX          0           0     4       3        0        0     30.30\n2001-01-01\
  \ 00:10:00  KPDX          0           0     4       3        4       80     30.30\n\
  2001-01-01 00:15:00  KPDX          0           0     3       2        5       90\
  \     30.30\n2001-01-01 00:20:00  KPDX          0           0     3       2    \
  \   10      110     30.28\n</code></pre>\n<p>Example of a duplicate case:</p>\n\
  <pre><code>import pandas as pd\nimport datetime\n\nstartdate = datetime.datetime(2001,\
  \ 1, 1, 0, 0)\nenddate = datetime.datetime(2001, 1, 1, 5, 0)\nindex = pd.date_range(start=startdate,\
  \ end=enddate, freq='H')\ndata1 = {'A' : range(6), 'B' : range(6)}\ndata2 = {'A'\
  \ : [20, -30, 40], 'B' : [-50, 60, -70]}\ndf1 = pd.DataFrame(data=data1, index=index)\n\
  df2 = pd.DataFrame(data=data2, index=index[:3])\ndf3 = df2.append(df1)\n\ndf3\n\
  \                       A   B\n2001-01-01 00:00:00   20 -50\n2001-01-01 01:00:00\
  \  -30  60\n2001-01-01 02:00:00   40 -70\n2001-01-01 03:00:00    3   3\n2001-01-01\
  \ 04:00:00    4   4\n2001-01-01 05:00:00    5   5\n2001-01-01 00:00:00    0   0\n\
  2001-01-01 01:00:00    1   1\n2001-01-01 02:00:00    2   2\n</code></pre>\n<p>And\
  \ so I need <code>df3</code> to eventually become:</p>\n<pre><code>            \
  \           A   B\n2001-01-01 00:00:00    0   0\n2001-01-01 01:00:00    1   1\n\
  2001-01-01 02:00:00    2   2\n2001-01-01 03:00:00    3   3\n2001-01-01 04:00:00\
  \    4   4\n2001-01-01 05:00:00    5   5\n</code></pre>\n<p>I thought that adding\
  \ a column of row numbers (<code>df3['rownum'] = range(df3.shape[0])</code>) would\
  \ help me select the bottom-most row for any value of the <code>DatetimeIndex</code>,\
  \ but I am stuck on figuring out the <code>group_by</code> or <code>pivot</code>\
  \ (or ???) statements to make that work.</p>"
