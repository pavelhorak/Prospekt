raw_text: "How can I save an activity state using the save instance state?\n\n<p>I've\
  \ been working on the Android SDK platform, and it is a little unclear how to save\
  \ an application's state. So given this minor re-tooling of the 'Hello, Android'\
  \ example:</p>\n<pre class=\"lang-java prettyprint-override\"><code>package com.android.hello;\n\
  \nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.widget.TextView;\n\
  \npublic class HelloAndroid extends Activity {\n\n  private TextView mTextView =\
  \ null;\n\n  /** Called when the activity is first created. */\n  @Override\n  public\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \n    mTextView = new TextView(this);\n\n    if (savedInstanceState == null) {\n\
  \       mTextView.setText(&quot;Welcome to HelloAndroid!&quot;);\n    } else {\n\
  \       mTextView.setText(&quot;Welcome back.&quot;);\n    }\n\n    setContentView(mTextView);\n\
  \  }\n}\n</code></pre>\n<p>I thought it would be enough for the simplest case, but\
  \ it always responds with the first message, no matter how I navigate away from\
  \ the app.</p>\n<p>I'm sure the solution is as simple as overriding <code>onPause</code>\
  \ or something like that, but I've been poking away in the documentation for 30\
  \ minutes or so and haven't found anything obvious.</p>"
