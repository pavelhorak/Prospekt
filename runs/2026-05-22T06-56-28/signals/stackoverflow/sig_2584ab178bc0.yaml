raw_text: 'How does Facebook disable the browser&#39;s integrated Developer Tools?


  <p>So apparently because of the recent scams, the developer tools are exploited
  by people to post spam and even used to &quot;hack&quot; accounts. Facebook has
  blocked the developer tools, and I can''t even use the console.</p>

  <p><img src="https://i.sstatic.net/Wiatp.png" alt="Enter image description here"
  /></p>

  <p>How did they do that?? <a href="https://stackoverflow.com/questions/7559409/disable-developer-tools">One
  Stack Overflow post claimed it is impossible</a>, but Facebook has proven them wrong.</p>

  <p>Just go to Facebook and open up the developer tools, type one character into
  the console, and this warning pops up. No matter what you put in, it will not get
  executed.</p>

  <p>How is this possible?</p>

  <p>They even blocked auto-complete in the console:</p>

  <p><img src="https://i.sstatic.net/j0Zmx.png" alt="Enter image description here"
  /></p>'
