raw_text: I&#x27;ve hired people before, and usually when it comes time to send rejection
  emails it can be very hard.<p>If someone clearly isn&#x27;t right for the job, you
  owe it to them to mention why- I&#x27;m an engineer, I work in absolutes and &quot;Culture
  fit&quot; or something so wishy-washy doesn&#x27;t roll well off my fingers.<p>But
  how do you tell people that they lack basic knowledge or experience in certain areas
  without sounding bitchy or attacking.<p>Even worse is the ones that interviewed
  well, or showed significant competence.. yet were not as strong as another candidate.<p>I
  agree it&#x27;s wrong to send nothing- but it can be hard to formulate a pleasant
  email.. especially if you&#x27;ve interviewed many people. (10-15 at my last employment,
  I was replacing myself and had limited time to document&#x2F;check everything).
