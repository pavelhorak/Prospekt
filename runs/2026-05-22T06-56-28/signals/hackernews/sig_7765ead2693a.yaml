raw_text: Honesty is best policy.<p>Effectively there's a difference between investors
  and partners. Investors put in money and reap profits. Partnership has to do with
  sacrifice (time).<p>In all fairness I'd say it would be good if you take your current
  salary ( from startup ) + his current salary ( from startup + job ) and divide that
  by 2.<p>It is only fair if you both do equal amounts of work a week that both get
  the same benefit in a 50/50 partnership.<p>If that's not viable, propose the reallocation
  of shares - you could always visit a lawyer.<p>Alternatively, if you're running
  the business - take a vacation and see if he picks up the slack.
