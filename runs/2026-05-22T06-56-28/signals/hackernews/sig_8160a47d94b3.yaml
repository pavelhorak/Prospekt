raw_text: Going into an era of launch vehicle re-usability with SpaceX seemingly so
  technologically far ahead (still the only party to retro-propulsively land an orbital
  launch vehicle), part of me feels that this dominance is entirely deserved for having
  the vision and taking the risk to develop cost effective reusability, and Ariane
  has enjoyed a cushy position for too long. Another part of me feels that Europe
  needs a serious competitor to American space-launch to retain independent capability.
