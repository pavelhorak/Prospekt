raw_text: I really thought I could never switch away from Firefox because of all of
  the extensions I "couldn't live without," but I started playing with Webkit nightlies
  a few weeks back and never looked back. It's faster, launches quickly, eats less
  memory (look! It's only at half a gig!), and has high-res scrolling. The last one,
  albeit small, is killer for me. Reading articles on the web is a whole difference
  experience when you have good font rendering and truly smooth scrolling. I use keyboard
  shortcuts to turn off the location and bookmarks bars most of the time to make the
  browser get out of my way and let me use my webapps. Goodbye, Firefox!
