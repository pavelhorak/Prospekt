raw_text: Yeah. OpenAI is apt to force filters on their transformers&#x27; outputs.
  A year or two ago they threatened to kill AIDungeon after discovering that users
  were generating unsettling text with it. Since AIDungeon was built off the back
  of GPT3 and GPT2.5, they had no choice to comply, which led to developers and temps
  manually reading users&#x27; stories after they were flagged for &quot;harmful content.&quot;
  That harmful content filter is very similar to what you see on chatGPT. Users screamed
  their privacy concerns, and the product became noticeably &quot;worse&quot; at generating
  prose&#x2F;stories.<p>Most users used the same phrasing you have - the AI was &quot;crippled.&quot;
  Shortly after, alternatives that at least <i>claim</i> to not invade your privacy
  sprang up, and I see much less of AIDungeon today.<p>OpenAI does not support the
  free use of their technology. As always, don&#x27;t be fooled by the &quot;Open&quot;
  in the name. If you or your product does something they, or Microsoft, dislikes,
  your access could be revoked anytime. It seems unlikely to me they&#x27;d change
  their outlook now
