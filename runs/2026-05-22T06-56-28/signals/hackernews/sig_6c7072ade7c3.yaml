raw_text: Why would you get an LLM to transpile the formula for you? There are already
  libraries that attempt to do this. Wouldn&#x27;t your time be better served in expanding
  these libraries to overcome deficiencies? I don&#x27;t get why you would throw away
  all the work done in this space and just offload it to an LLM. It&#x27;s a technical
  problem. Imagine if ditched all transpilers and gave it to an LLM and said &quot;good
  luck!&quot;<p><a href="https:&#x2F;&#x2F;formulas.readthedocs.io&#x2F;en&#x2F;stable&#x2F;"
  rel="nofollow">https:&#x2F;&#x2F;formulas.readthedocs.io&#x2F;en&#x2F;stable&#x2F;</a>
