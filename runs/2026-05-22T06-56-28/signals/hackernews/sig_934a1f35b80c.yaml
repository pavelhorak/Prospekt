raw_text: If my model is used to profile a given user such as to maximize revenue
  from them (my objective is generally increasing with a more accurate classification
  of a user to the degree that such categories are revenue relevant), does this model
  still work?<p>If so, how is it privacy compliant, i.e. suffice the intent of the
  law in say, EU countries, or will not be identified as &quot;privacy theater&quot;
  in the US? If not, what do you do in these cases?<p>Cool to get your take on this.
