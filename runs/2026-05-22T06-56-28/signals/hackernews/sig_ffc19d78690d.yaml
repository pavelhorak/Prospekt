raw_text: If this was accessible for Voice Over (the MacOS screen reader), blind developers
  would literally bless you for this. Half of those non-coding, web-based tools have
  huge accessibility problems, and an efficient and ergonomic interface would be a
  godsend. I can&#x27;t test the accessibility aspect myself, now, as I don&#x27;t
  own a Mac and I don&#x27;t work in a team environment, but I can get you in touch
  with some people if you&#x27;re interested. The fact that you&#x27;re doing native
  and that you&#x27;re focused on the keyboard means there&#x27;s much hope, though.
