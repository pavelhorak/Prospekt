raw_text: 'No, it&#x27;s not grocery bills, it&#x27;s that post pandemic:<p>1. Used
  cars go for 50% more than they did before.<p>2. New cars are selling at or above
  MSRP.<p>3. Housing prices went up 30% or more where people want to buy.<p>4. Interest
  rates for loans to buy those overpriced houses are now 2-4 times what they were
  when those prices went up.<p>5. Rents have gone up and availability has gone down.<p>6.
  And yes, on top of that prices for everything have gone up, including groceries.<p>And
  how have salaries kept up with this? That&#x27;s right, they haven&#x27;t. The median
  income in 2019 was 27.7K and in 2021 went up to... wait for it... 28.8k. No inflation
  adjustment in there.<p><a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Personal_income_in_the_United_States"
  rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Personal_income_in_the_United_...</a><p>This
  isn&#x27;t rocket science, why is it that financial and economic reporters seem
  so out of touch with reality? I have read and listened to multiple interviews that
  have the same theme of &quot;the percent gdp growth is good, people just think things
  are bad because they&#x27;re having an emotional reaction&quot;. People think things
  are bad because the average person can&#x27;t afford basic things.<p>29K a year
  is roughly $2,400 a month.<p>Average rent in the USA is $1,300

  <a href="https:&#x2F;&#x2F;www.forbes.com&#x2F;advisor&#x2F;mortgages&#x2F;average-rent-by-state&#x2F;"
  rel="nofollow">https:&#x2F;&#x2F;www.forbes.com&#x2F;advisor&#x2F;mortgages&#x2F;average-rent-by-sta...</a><p>Average
  car payment (on a used car) is $530

  <a href="https:&#x2F;&#x2F;www.nerdwallet.com&#x2F;article&#x2F;loans&#x2F;auto-loans&#x2F;average-monthly-car-payment"
  rel="nofollow">https:&#x2F;&#x2F;www.nerdwallet.com&#x2F;article&#x2F;loans&#x2F;auto-loans&#x2F;average-...</a><p>That
  leaves $570 for car insurance, health insurance, food, etc.<p>The math doesn&#x27;t
  add up for most people and it certainly doesn&#x27;t add up to being able to afford
  a more expensive things like a home, a new car, a family. People are frustrated
  because they look at the future and see forever renting, leasing, working low paying
  jobs, and never being able to live that lives that most before them did.'
