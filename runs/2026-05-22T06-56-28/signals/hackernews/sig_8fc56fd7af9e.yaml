raw_text: Congrats on the launch guys!<p>Full disclosure, I worked with Nick and Omar
  at Gusto. I saw firsthand how much software can help an ops team. Since we didn&#x27;t
  have Flowdash at Gusto, we often scrambled for resources to empower our operations
  team. We also probably could&#x27;ve done a better job responding to user feedback
  since we were so resource constrained.<p>Having a tool that the Ops team can truly
  own is a game-changer for that iterative feedback loop and frees up the eng team.
  Really looking forward to seeing this product grow.
