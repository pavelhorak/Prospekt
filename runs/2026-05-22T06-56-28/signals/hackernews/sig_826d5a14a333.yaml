raw_text: Seems to be working for them but I would typically advise against too much
  energy spent on automation and internal tools too early. Tools can really slow you
  down in the early going when things are changing rapidly. And you can typically
  throw inexpensive bodies at many of the tasks that are otherwise candidates for
  automation.<p>The one thing I do like is that building tools gives more employees
  experience in building product.
