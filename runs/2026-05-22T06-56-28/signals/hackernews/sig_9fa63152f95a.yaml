raw_text: 'You should add <a href="https:&#x2F;&#x2F;www.roastworks.co.uk&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.roastworks.co.uk&#x2F;</a>
  in the UK - they are surprisingly affordable for great quality, their Guji Natural
  is a staple in my ever changing bean selection I have at home.<p>You should also
  add notes coffee roasters from the UK: <a href="https:&#x2F;&#x2F;notescoffee.shop&#x2F;products&#x2F;iwd-pao-villages-myanmar?variant=40475330052159"
  rel="nofollow">https:&#x2F;&#x2F;notescoffee.shop&#x2F;products&#x2F;iwd-pao-villages-myanmar?v...</a><p>This
  Myanmar coffee is what got me exploring beans outside Ethiopia and Kenya again<p>Also
  Story coffee <a href="https:&#x2F;&#x2F;www.storycoffee.co.uk&#x2F;" rel="nofollow">https:&#x2F;&#x2F;www.storycoffee.co.uk&#x2F;</a>
  - their Christmas roast with beans from Sidamo in 2023 has me still thinking about
  them<p>And finally Roca Junior from Munich: they are by far the best roasters in
  Munich and I could name a few more good ones there <a href="https:&#x2F;&#x2F;rocajunior.de&#x2F;"
  rel="nofollow">https:&#x2F;&#x2F;rocajunior.de&#x2F;</a><p>Ok and at least one honorable
  mention from a trip I recently did to Toulouse: Cerise - outstanding fruity natural
  processed beans and balanced roasts: <a href="https:&#x2F;&#x2F;lecafecerise.fr&#x2F;boutique-cafes&#x2F;"
  rel="nofollow">https:&#x2F;&#x2F;lecafecerise.fr&#x2F;boutique-cafes&#x2F;</a><p>I
  could give many more recommendations of local roasters in European cities, I try
  to visit as many as possible when I travel, take bags home and mark them on google
  maps. I guess some are difficult to get shipped&#x2F;order online but this DB could
  also be great to find local gems in your area'
