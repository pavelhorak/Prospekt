raw_text: It's interesting how the iCloud branding plays into this.  Because Apple
  includes so many services under the umbrella term iCloud, it can lead to a very
  different impression of the service between the users and the developers.  All the
  talk about "iCloud is broken" is about one specific part, Core Data syncing.  The
  rest, like online backup and document syncing and calendars, seems to work most
  of the time.  I actually saw some comments elsewhere along the lines of "iCloud
  works fine for me as a user, so it's probably just bad developers who can't get
  it to work, not any issue with Apple."
