raw_text: It sounds like Charmeau is willing to blame anything and everything to avoid
  the reality that SpaceX is bringing a new economy to the space launch industry.  Instead
  of marketing Ariane as a boutique, reliable launch vehicle for valuable payloads
  like JWT, it seem like Charmeau wants to blame everyone but himself for Ariane&#x27;s
  financial uncertainty.<p>If I were on the board, I&#x27;d ask for his resignation
  and start looking for a more visionary leader to guide Ariane.
