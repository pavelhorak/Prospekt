raw_text: Tools like this are great because they make creating software less seem
  scary. I&#x27;ve found that business users are deterred from creating software because
  they need to write structured text &amp; use syntax to do it. I would have thought
  that the problem solving part was the hard part, but for them it&#x27;s the act
  of representing something in text; it&#x27;s some kind of insurmountable barrier
  that I don&#x27;t understand. But with WYSIWYG tools like this, the barrier is gone
  and they&#x27;re totally content to start building reasonably complex systems.<p>Of
  course it becomes a tangled mess later, but at least they managed to solve a problem.
