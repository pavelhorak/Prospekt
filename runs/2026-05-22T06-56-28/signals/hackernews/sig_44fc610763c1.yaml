raw_text: 'The author does a good job of pointing out the hypocrisy in complaining
  about government subsidies yet refusing to make his company more competitive because
  that would jeopardise the government subsidies his company gets.<p>The last is noteworthy:<p>&quot;It
  is about future business,&quot; Charmeau said. &quot;Why do all the billionaires
  invest in space? Why does Jeff Bezos come to Germany and declare that the country
  should not go to space? He makes money with your personal data. Today he knows your
  Amazon orders, tomorrow he drives your car.&quot;<p>Goes to show you where much
  of the EU&#x27;s animosity towards US tech firms comes from: local firms and powerful
  business people with access to politicians lobbying for protectionism.'
