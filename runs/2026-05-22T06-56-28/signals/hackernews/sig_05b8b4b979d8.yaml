raw_text: 'Ask HN: Alternatives to Chat GPT for writing code


  I love how well Chat GPT writes code , particularly when I do want to do the grunt
  work of googling to figure out how to get started. However it&#x27;s very painful
  to see code get cut off, some times mid function. Of course you can work around
  this, but to my dismay, even a paid subscription doesn&#x27;t override the character
  limit.<p>I&#x27;m open to paying for this, but is anything else available ?'
