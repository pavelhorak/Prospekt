raw_text: 'It’s also been a long time since the Trustbusting times of Theodore Roosevelt
  and the Great Depression reforms have largely been repealed. Congress absolutely
  could act if the political will was reflected at the ballot box.<p>Elsewhere it’s
  been noted these scores don’t line up with how much is actually being purchased
  by people. There’s something else going on than just economics.<p>Otherwise, I deeply
  suffered from the Great Recession. Couldn’t find meaningful work for many years.
  This despite being well educated and qualified. I think we can agree these days
  are not those days: RE was cheaper. Food was cheaper. There just wasn’t enough demand
  for labor to employ people and thus fund demand. Trillions in RE “value” had to
  be marked to market and lost value. Trillions in debt were no longer ever going
  to be realized. Huge companies were facing bankruptcy and filed bankruptcy. At least
  one automaker had a sitting POTUS as its CEO for a while.<p>Nowadays, people do
  seem to be employed but prices have risen. We also have an ever growing war in one
  of the most important breadbaskets of the world. We knew that was going to raise
  global food prices.'
