raw_text: This is an interesting project by all means, but I&#x27;m curious as to
  what your goal&#x2F;vision for this project is.  The reason that most online forum-esque
  services involve some sort of moderation isn&#x27;t because they give in to the
  so-called &quot;woke SJW Twitter mob&quot;, it&#x27;s because they want to expand
  their user bases - a platform cannot host large amounts of sexist content and attract
  women, it cannot stop taking action against content that is racist and expect a
  multicultural user base, and so forth.<p>As for an intial starting point, it makes
  sense that you are looking to capture users that have been kicked off places like
  Reddit, FB, or can&#x27;t participate on Parler any longer and I&#x27;m sure you
  will have success within that target group if you are able to get this off the ground.  However,
  I&#x27;m not sure where you&#x27;re going to get new users from after that - and
  without a more diverse user base, you are not only limiting the spread of ideas
  from your platform to elsewhere but are also creating an echo chamber where people
  who self-select for &quot;my views are not tolerable in the mainstream&quot; are
  the only ones who are talking.  This problem will get worse over time, and make
  it even harder to attract new users.<p>Like you say in your blog post, a major source
  of frustration with existing technology is that &quot;They prefer purity to practicality&quot;.  It
  seems an awful lot like you are trying to do the same thing here, and while this
  project will certainly be <i>entertaining</i>, I&#x27;m not sure how viable this
  will end up being - I&#x27;m having a hard time seeing this as anything other than
  another Voat&#x2F;Ruqqus.
