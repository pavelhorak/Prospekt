raw_text: 'Ask HN: do you ever clean your email marketing db from inactives?


  I used to do periodically clean our email db by hand, but it quickly became time
  consuming, so I built an internal tool to easily run list cleaning in Mailchimp
  and other ESPs.<p>It&#x27;s pretty simple: it connects to the Mailchip API, looks
  at each contacts, identifies those inactive and either classify them in a special
  segment (e.g. &quot;Inactives&quot;) or archives them directly. It also reduces
  bounce rate since it checks the validity of all the new incoming emails (e.g. from
  mispellings in form submissions, spambots etc) before the first email goes out.<p>I&#x27;m
  now thinking whether it&#x27;s worth to launch this publicly. Would anyone else
  use this? How do you currently maintain email lists for your companies?<p>Thanks!'
