raw_text: One downside to this approach is that it can tend to create status or power
  rifts between the product people and the tools people. In traditional shops, the
  &quot;skills that pay the bills&quot; product people often get better treatment,
  higher status, greater advancement opportunity and stronger job security than tooling
  people, who are often seen as being on the cost side of the business.<p>Startups
  that go down this route should be on the lookout for this potential for divisiveness
  and culture fragmentation.
