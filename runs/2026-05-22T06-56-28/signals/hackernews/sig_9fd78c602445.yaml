raw_text: Congratuations on the launch, Sri Teja.<p>A couple questions:<p>How is Swipe
  different from <i>Bikayi.com</i> (coincidentally by IIIT-H and YCombinator alumnus,
  just like yourself)?<p>And how different is Swipe to <i>Khatabook</i>, <i>OKCredit</i>
  and other such similar solutions? Do they not focus as much on IT (gst&#x2F;tax)
  compliance? Where is the catch?<p>----<p>The landing page has more <i>contact us</i>
  CTAs than <i>get started</i>, you may want to flip the ratio around?<p>Also, I believe
  embedding YouTube video on the homepage might help given trying the product requires
  sign-up (in addition to linking users to to your YouTube channel for tutorials).<p>Per
  my reading, WhatsApp integration is one of the differentiators, but the service
  lacks a mobile app? That is a strange disconnect. What isn&#x27;t the landing page
  telling me about the integrations?<p>----<p>As someone who knows <i>many</i> small,
  often home-run businesses, Swipe is definitely onto something, filling a niche that
  other services won&#x27;t &#x2F; don&#x27;t. It would be interesting to watch Swipe&#x27;s
  progress, especially since copycats are on-the-rise given never-seen-before fund
  raises by Indian VCs. All the best.
