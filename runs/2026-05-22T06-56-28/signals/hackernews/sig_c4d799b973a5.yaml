raw_text: OK - you recognise that it was an error not to change the equity split at
  the point when your level of commitment to the project abruptly changed and exceeded
  your partners.<p>In your current situation I assume you are now drawing a salary
  as a full time employee of the business. Any income split between you and your partner
  would be on the profits - so you should get your salary plus 50% of any profit after
  expenses (including your salary). Provided your salary remains at a commensurate
  level then your respective incomes should reflect the realities of your current
  situation. No harm in your partner receiving a small salary for his administrative
  tasks - just make sure it reflects the level of work and (perhaps) industry norms.
