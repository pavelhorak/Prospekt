raw_text: HN is going to have to acknowledge that the hype&#x2F;controversy&#x2F;reprisal
  loop exists for new technologies. There&#x27;s a lot of people scared of AI, just
  as there are a lot of people scared of self-driving cars.<p>In both cases the tech
  solution has been to disclaim all responsibility onto the user. The self-driving
  car can disengage at any time, meaning that the human was responsible for the last
  second before the crash. Similarly, people are going to say that chat AI producing
  &quot;bad&quot; output is purely a function of the prompt. Neither of these are
  going to wash with the general public once people start getting killed. Or even
  just inundated with slurs - remember &quot;Tay&quot;? <a href="https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Tay_(bot)"
  rel="nofollow">https:&#x2F;&#x2F;en.wikipedia.org&#x2F;wiki&#x2F;Tay_(bot)</a><p>We&#x27;re
  still a way off the first chatgpt casualty, which I&#x27;m guessing will be someone
  who asked it for medical advice or how to identify mushrooms or similar.
