raw_text: I&#x27;ve been in situations where I&#x27;m waiting to make a tricky left
  turn safely while people behind me literally yell at me to go faster. Now those
  same people have to contend with cars that can&#x27;t be intimidated into making
  risky turns by the driver behind them yelling, honking, or tailgating. I hope it
  plays out like this:<p>1. Driver tailgates at an intersection or stop sign to try
  to intimidate the driverless car in front of him into going faster.<p>2. Driverless
  car ignores it, and gets rear-ended.<p>3. Google helpfully provides the tailgater&#x27;s
  insurance company with a copy of the 360 degree video, conclusively proving his
  guilt under law.<p>4. Tailgater&#x27;s insurance rates skyrocket after his insurer
  is forced to pay the maximum to repair the expensive driverless car.<p>5. Tailgater
  is forced to stop being a jackass.
