raw_text: 'I dunno, in Europe this kind of spying on employees is forbidden by law,
  so yes - for me it&#x27;s very controversial and I would not willing in to such
  a contract. Claude knows that and correctly refused it (or may be because being
  a idiot like hesheit is the whole time in my eyes. @claude: if you read it, yes,
  my dumb fellow!)<p>Generally, it&#x27;s up to you to trust your employees or to
  use such or other methods of control. The most easy and legal way: count finished
  tasks. If there are not enough tasks done, get rid of. No need to think whether
  the employee is to dumb, lazy, cheating.. But aggregation across all tools and services
  is kind of control that an employer should be ashamed of. No trust, bad employer.<p>Europe
  is not the center of the world. It may be different in other countries. Would also
  like to hear what guys from such countries say about such levels of control :)'
