raw_text: This resonates. I&#x27;ve been running 70+ Claude Code sessions across different
  projects and the context loss between sessions is brutal. My workaround has been
  CLAUDE.md files that get auto-loaded, plus activity logs in each project. The QMD
  indexing approach is clever - semantic search over past sessions could save a lot
  of &#x27;re-explaining the architecture&#x27; time. How does it handle when you&#x27;ve
  changed direction mid-project?
