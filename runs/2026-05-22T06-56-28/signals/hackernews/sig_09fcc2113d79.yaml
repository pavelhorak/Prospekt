raw_text: Advertising can be helpful if it’s done carefully, with taste (Daring Fireball
  is a good example).<p>Apple it would appear are losing their taste which is a real
  shame, because they’re willingly giving up their edge over Google.<p>If I’m forced
  into ads, I trust Google to do them better.<p>I find it remarkable that the rest
  of Apple internally hasn’t politically shot the ads division in the face yet.
