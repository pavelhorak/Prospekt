raw_text: 'allium skills: document invariant+@guidance pattern for complex semantics


  ## Context


  When Allium behaviors are too complex to express as trigger/ensures rules (e.g.,
  concurrent iteration, parallel merge, heterogeneous collection processing), there''s
  a useful workaround pattern that isn''t documented in the allium skills.


  ## Pattern


  Use `invariant Name { true }` with an `@guidance` block for prose:


  ```allium

  invariant ParallelMerge { true }

  @guidance """

  All parallel branches execute concurrently.

  Results are merged into the parent entity when all branches complete.

  """

  ```


  The checker accepts this; the meaningful content lives in the guidance annotation.


  ## Request


  Document this pattern in the allium skills (likely `allium:tend` or a new "Spec
  Authoring Patterns" section) explaining:

  - When to use formal rules vs invariant+@guidance

  - Reserve formal rules for entity state transitions and attribute causality

  - Use invariants+@guidance for behaviors involving collection processing or multi-phase
  concurrency


  ## Source


  Discovered during wemble issue #109 — parallel/iterate/cond semantics couldn''t
  be expressed cleanly with Allium rule syntax.'
