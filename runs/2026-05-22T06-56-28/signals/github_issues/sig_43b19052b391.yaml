raw_text: "sac2c: Array and Complex modules cannot be used together (symbol conflicts\
  \ + lexer ICE)\n\n# `Array: all` and `Complex: all` cannot be used together\n\n\
  ## Error (full import)\n```\nError: Symbol 'reverse' used more than once\n  ...\
  \ from module 'Complex'\n  ... from module 'Array'\nCompilation failed while Running\
  \ module system, 32 error(s).\n```\n\n## Error (selective import workaround attempt)\n\
  ```\nInternal compiler error\nAssertion \"!buf_empty\" failed at src/libsac2c/scanparse/lex.c:1241\n\
  \  -- buffer should never be empty at this point\n```\n\n## Reproduction\n```bash\n\
  # Full import — 32 symbol conflicts\nsac2c test.sac -o test.out\n\n# Selective import\
  \ — lexer ICE\nsac2c test_selective.sac -o test_selective.out\n```\n\nImporting\
  \ both `Array: all` and `Complex: all` produces 32 symbol conflicts. Attempting\
  \ to work around this with selective imports from Array (listing individual symbols)\
  \ triggers a separate ICE in the lexer.\n\n## Workaround\nUse `Structures: all`\
  \ instead, which provides both array operations and complex types without conflicts."
