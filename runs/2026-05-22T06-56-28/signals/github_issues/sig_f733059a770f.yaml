  no duplicates.

  - [x] **me or my organization is currently an active sponsor of the product at the
  $99,- level.


  ### Problem Statement


  We want to enable the "Use security keys for sign-in" of Windows Hello for Business
  (found at Intune > Devices > Windows > Enrollment > Windows Hello for Business)
  through a CIPP Standard template. Right now the only way to configure this is manually
  by logging into the tenant


  Please add the "Use security keys for sign-in" configuration to the "Windows Hello
  for Business enrollment configuration" template. All other features of this blade
  are configurable by this template, so it makes sense to add this one there.


  ### Benefits for MSPs


  Reduces the manual work of logging into each tenant to configure.


  ### Value or Importance


  It''s a nice-to-have. Every step towards being able to configure tenants fully through
  templates is a good step forward.


  ### PowerShell Commands (Optional)


