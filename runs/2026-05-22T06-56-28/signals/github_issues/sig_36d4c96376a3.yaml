raw_text: "fix(module/es): TS2677 errors on complex conditional type predicates (TROUBLESHOOTING.typescript.md)\n\
  \n> *This was generated by AI during triage.*\n\n## Agent Brief\n\n**Category:**\
  \ bug\n\n**Summary:** `TROUBLESHOOTING.typescript.md` documents TS2677 errors when\
  \ type predicate return types use conditional types with `infer` and intersections.\
  \ Example from the doc:\n\n```ts\nexport function maybeAsyncSchemaIsSchemaAsync<\n\
  \  const MyMaybeAsyncSchema extends MaybeAsyncSchema = MaybeAsyncSchema,\n>(\n \
  \ maybeAsyncSchema: MyMaybeAsyncSchema,\n): maybeAsyncSchema is MyMaybeAsyncSchema\
  \ extends SchemaAsync<infer Input, infer Output>\n  ? SchemaAsync<Input, Output>\n\
  \  : Schema & MyMaybeAsyncSchema  // TS2677\n{\n```\n\n**Current behavior:**\nTypeScript\
  \ rejects type predicates whose conditional-type true branch doesn't include the\
  \ parameter type. This forces awkward refactors (assertion functions, simpler predicates).\n\
  \n**Desired behavior:**\n1. Audit the workspace for type predicates that hit TS2677.\n\
  2. For each: choose between (a) simplify the predicate, (b) convert to assertion\
  \ function (`asserts value is T`), (c) document as a known TS limitation with workaround.\n\
  3. Add the pattern to a `module/es` style guide.\n\n**Acceptance criteria:**\n-\
  \ [ ] All workspace type predicates type-check.\n- [ ] Known TS2677-triggering patterns\
  \ are documented.\n- [ ] A consumer can find guidance without re-deriving the issue.\n\
  \n**Out of scope:**\n- Filing a TypeScript upstream issue (TS team has rejected\
  \ similar requests before; we adapt rather than wait)."
