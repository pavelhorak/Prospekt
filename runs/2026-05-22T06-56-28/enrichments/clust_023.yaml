competitor_weaknesses:
  Make:
  - Operations-based pricing model is confusing and hard to predict; costs spike with
    high-frequency or multi-step workflows
  - Limited native support for unstructured document extraction; strong for API-connected
    apps, weak for OCR/form parsing
  - No built-in AI document understanding; requires third-party integrations for IDP
    use cases
  Zapier:
  - Task-based pricing becomes expensive quickly at scale (>2,000 tasks/month)
  - API-first only — cannot automate desktop/UI workflows where no API exists
  - Not suited to document-heavy extraction pipelines without bolting on external
    tools
  Nanonets:
  - Per-page pricing creates cost unpredictability for multi-page or bursty document
    loads
  - Accuracy degrades on highly variable or non-standard document layouts
  - Limited workflow orchestration beyond extraction; users still need a separate
    automation layer
  Docsumo:
  - Smaller integration ecosystem; enterprise connectors require custom API work
  - Limited support for complex multi-document workflows or approval routing
  - Starter tier ($25/mo) is restrictive at 100 pages/month — inadequate for real
    ops teams
  Rossum:
  - $1,500/month entry point prices out SMBs and early-stage ops teams entirely
  - Setup and configuration requires vendor-assisted onboarding; slow time-to-value
  - Focused narrowly on finance/AP document types; less adaptable to insurance or
    healthcare forms
